; PlatformIO Project Configuration File
; M5Stack Cardputer ADV Flight Tracker

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_HAS_PSRAM

lib_deps =
    m5stack/M5Cardputer@^1.0.2
    bblanchon/ArduinoJson@^7.0.0

; After build, merge into a single .bin for M5Launcher
extra_scripts = post:merge_bin.py
